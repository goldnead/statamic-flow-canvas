<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #172554 0%, #0F1B3D 55%, #050914 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #E4E4E7; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #A1A1AA; box-shadow: 0 0 18px #A1A1AA; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#E4E4E7,#D4D4D8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #E4E4E7; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #A1A1AA47, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Flow Canvas</span></h1>
      <p class="sub">The shared node-graph editor behind Automations and Funnels. One editor, consumed twice.</p>
      <div class="badges">
        <span class="badge">Kinds are data</span>
        <span class="badge">Wording from the host</span>
        <span class="badge">MIT</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#A1A1AA"/><stop offset="1" stop-color="#3F3F46"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3F3F46" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- three nodes and the wires between them, in the neutral the foundation
       layer wears. Grey on purpose: this is plumbing that two products stand on,
       not a product with a personality of its own. -->
  <rect x="238" y="150" width="36" height="88" rx="18" fill="#FFFFFF" opacity=".55"/>
  <rect x="168" y="300" width="176" height="24" rx="12" fill="#FFFFFF" opacity=".55"/>
  <rect x="168" y="300" width="24" height="34" rx="12" fill="#FFFFFF" opacity=".55"/>
  <rect x="320" y="300" width="24" height="34" rx="12" fill="#FFFFFF" opacity=".55"/>
  <g filter="url(#sh)">
    <rect x="180" y="72" width="152" height="88" rx="26" fill="#FFFFFF"/>
    <rect x="72" y="326" width="152" height="88" rx="26" fill="#FFFFFF"/>
    <rect x="288" y="326" width="152" height="88" rx="26" fill="#FFFFFF"/>
  </g>
      </svg>
    </div>
  </div>
</body>
</html>
